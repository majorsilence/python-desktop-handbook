<!doctype html>
<html lang="{{ site.lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
    <meta name="author" content="{{ site.author }}">
    <link rel="stylesheet" href="{{ '/assets/css/book.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}">
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <header class="masthead">
      <a class="masthead-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="masthead-nav">
        <a href="{{ '/' | relative_url }}">Contents</a>
        <a href="{{ '/pygtk-notebook.pdf' | relative_url }}">PDF</a>
        <a href="https://github.com/majorsilence/pygtknotebook">Source</a>
      </nav>
    </header>

    <main id="main">
      {{ content }}
    </main>

    <footer class="colophon">
      <p>
        {{ site.title }} version {{ site.version }} by {{ site.author }}.
        Text licensed <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a>;
        sample code released under the MIT license.
      </p>
    </footer>
  </body>
</html>
