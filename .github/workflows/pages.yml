name: Build and deploy book

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  examples:
    name: Smoke-test the examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolkits
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo python3-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-webkit-6.0 \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            xvfb dbus-x11
          pip install PySide6

      - name: Start every example and shut it down again
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          QT_QPA_PLATFORM: offscreen
        # A session bus, because some examples own a name on it.
        run: dbus-run-session -- xvfb-run -a python3 tools/smoke-test.py examples/gtk4

      - name: Build, validate and install the packaging example
        run: |
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build libglib2.0-dev-bin libglib2.0-bin \
            desktop-file-utils appstream gettext
          cd examples/gtk4/packaging
          meson setup builddir --prefix="$PWD/_install"
          meson compile -C builddir
          meson test -C builddir        # desktop file, AppStream metadata, schema
          meson install -C builddir

  pdf:
    name: Build PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc and TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-recommended texlive-latex-extra

      - name: Build the PDF
        run: ./tools/build-pdf.sh --output build/python-desktop-notebook.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: python-desktop-notebook-pdf
          path: build/python-desktop-notebook.pdf
          if-no-files-found: error

  site:
    name: Build site
    runs-on: ubuntu-latest
    needs: pdf
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/configure-pages@v5
        id: pages

      - name: Collect the PDF built above
        uses: actions/download-artifact@v4
        with:
          name: python-desktop-notebook-pdf
          path: .

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --baseurl "${{ steps.pages.outputs.base_path }}" \
            --destination _site

      - name: Publish the PDF alongside the site
        run: cp python-desktop-notebook.pdf _site/python-desktop-notebook.pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs: site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
